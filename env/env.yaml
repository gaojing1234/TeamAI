# ============================================================================
# 团队级默认环境变量（随仓库分发到每个成员）
# ----------------------------------------------------------------------------
# ⚠ 这里只放**团队公共**的、与机器无关的值。
#   机器私有路径（node.exe 位置、本地 checkout 位置）**不要写进来** —— 那属于
#   本机 sidecar：~/.teamai/pcs-cline-bridge.json（由桥接器 --detect 生成，天然不入库）
#
# 解析优先级（低 → 高）：
#   本文件  <  本机 sidecar  <  --var KEY=VALUE  <  进程环境变量
#
# 本机需要的两个私有变量（首次部署跑一次即可）：
#   node scripts/teamai-mcp-bridge.mjs --detect
#     会写入 PCS_NODE        = 当前 node 可执行文件绝对路径
#            PCS_AGENT_ROOT  = pcs-agent 包根绝对路径
# ============================================================================

# 默认走 mock 模式：产出是固定夹具，用来验证"链路通"，不是验证"模型好"。
# 接真实模型请在成员机器上覆写为 live（本机 sidecar 或环境变量）。
PCS_LLM_MODE: mock
